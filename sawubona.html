<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Vi — Seu Sawubona de hoje</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    background:#1a2535;
    padding:48px 32px;
    position:relative;
    overflow:hidden;
  }

  /* fundo vivo — gradiente que respira */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(44,95,122,0.35) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(196,168,130,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 60% 30%, rgba(100,140,160,0.12) 0%, transparent 50%);
    pointer-events:none;
    animation:respirar 12s ease-in-out infinite alternate;
  }
  @keyframes respirar{
    from{opacity:0.7}
    to{opacity:1}
  }

  /* data */
  .data{
    font-family:'Jost',sans-serif;
    font-size:10px;
    letter-spacing:0.35em;
    color:rgba(196,168,130,0.5);
    text-transform:uppercase;
    text-align:center;
    position:fixed;
    top:32px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    opacity:0;
    animation:aparecer 1.2s ease forwards 0.3s;
  }

  /* área da carta */
  .carta{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:0;
    position:relative;
    z-index:2;
    max-width:320px;
  }

  /* linhas da carta */
  .linha{
    font-size:clamp(22px,6vw,32px);
    font-weight:300;
    font-style:italic;
    color:rgba(250,247,243,0.92);
    line-height:1.7;
    letter-spacing:0.02em;
    opacity:0;
    display:block;
  }

  .linha.pausa{
    height:clamp(12px,3vw,18px);
    display:block;
  }

  /* shikoba */
  .shikoba-wrap{
    margin-top:clamp(28px,6vw,44px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    opacity:0;
  }

  .shikoba-linha{
    width:24px;
    height:1px;
    background:rgba(196,168,130,0.4);
  }

  .shikoba-texto{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(18px,4vw,24px);
    font-weight:300;
    font-style:italic;
    color:rgba(196,168,130,0.75);
    letter-spacing:0.08em;
  }

  .shikoba-emoji{
    font-size:16px;
    margin-top:2px;
  }

  /* Te Vi rodapé */
  .tevi{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Jost',sans-serif;
    font-size:9px;
    letter-spacing:0.35em;
    color:rgba(196,168,130,0.3);
    text-transform:uppercase;
    opacity:0;
    animation:aparecer 1s ease forwards 1s;
    white-space:nowrap;
  }

  @keyframes aparecer{
    from{opacity:0;transform:translateX(-50%) translateY(6px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}
  }

  @keyframes surgir{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  @keyframes dissolver{
    from{opacity:1}
    to{opacity:0}
  }
</style>
</head>
<body>

<div class="data" id="data"></div>

<div class="carta" id="carta"></div>

<div class="tevi">Te Vi · shikoba.com.br</div>

<script>
// ─── CARTAS ────────────────────────────────────────────────────────────────
// Cada carta = array de linhas. String vazia = pausa visual entre blocos.

const CARTAS = [
  // Cartas para mim
  [
    "Você não precisa",
    "provar nada hoje.",
    "",
    "Só existir",
    "já é suficiente.",
    "",
    "Os dias melhores existem.",
    "E eles vêm."
  ],
  [
    "Sua dor é real.",
    "",
    "E você continua aqui.",
    "",
    "Isso é mais coragem",
    "do que parece."
  ],
  [
    "Você já passou por dias",
    "que achava que não ia passar.",
    "",
    "E passou.",
    "",
    "Vai passar esse também."
  ],
  [
    "Você merece os dias bons.",
    "",
    "Não como recompensa.",
    "",
    "Só porque existe."
  ],
  [
    "Nem todo dia",
    "precisa ser bonito.",
    "",
    "Alguns dias",
    "só precisam terminar.",
    "",
    "E tudo bem."
  ],
  [
    "Você carrega mais",
    "do que as pessoas veem.",
    "",
    "Eu vejo.",
    "E admiro."
  ],
  [
    "Hoje pode ser devagar.",
    "",
    "Devagar também é movimento.",
    "",
    "Estou aqui."
  ],
  // Eu te vejo
  [
    "Você se esforçou muito.",
    "",
    "Ninguém perguntou como foi.",
    "",
    "Eu pergunto.",
    "Como foi?"
  ],
  [
    "Você conquistou algo hoje.",
    "",
    "Pode ter passado em branco",
    "para todo mundo.",
    "",
    "Não passou para mim."
  ],
  [
    "Tem dias que a gente",
    "carrega tudo sozinho.",
    "E sorri mesmo assim.",
    "",
    "Eu vi esse sorriso.",
    "E o que estava embaixo dele."
  ],
  [
    "O mundo viu sua foto.",
    "Ninguém viu seu dia.",
    "",
    "Eu quero saber",
    "do seu dia."
  ],
  [
    "Você fez muito hoje.",
    "",
    "Sem aplausos.",
    "Sem reconhecimento.",
    "",
    "Mas não sem testemunha.",
    "Eu estava aqui."
  ],
  [
    "Tem uma versão sua",
    "que ninguém conhece direito.",
    "",
    "A que luta em silêncio.",
    "",
    "Essa é a que mais admiro."
  ],
  [
    "Você existe",
    "além do que mostra.",
    "",
    "Mais fundo.",
    "Mais complexo.",
    "Mais bonito."
  ],
];

// ─── LÓGICA DO DIA ─────────────────────────────────────────────────────────

function getCartaDoDia() {
  const hoje = new Date();
  const inicio = new Date(hoje.getFullYear(), 0, 0);
  const diaDaAno = Math.floor((hoje - inicio) / 86400000);
  return CARTAS[diaDaAno % CARTAS.length];
}

function formatarData() {
  return new Date().toLocaleDateString('pt-BR', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
}

// ─── CONSTRUÇÃO DA CARTA ────────────────────────────────────────────────────

function construir() {
  const carta = getCartaDoDia();
  const container = document.getElementById('carta');
  container.innerHTML = '';

  // tempo base de surgimento de cada linha
  const BASE = 1.2;      // início
  const PASSO = 0.75;    // intervalo entre linhas
  const PASSO_PAUSA = 0.3; // pausa visual menor

  let t = BASE;
  let tempoFim = BASE;

  carta.forEach((linha) => {
    if (linha === '') {
      // pausa visual
      const esp = document.createElement('span');
      esp.className = 'linha pausa';
      container.appendChild(esp);
      t += PASSO_PAUSA;
    } else {
      const p = document.createElement('span');
      p.className = 'linha';
      p.textContent = linha;
      p.style.animation = `surgir 0.9s ease forwards ${t}s`;
      container.appendChild(p);
      tempoFim = t;
      t += PASSO;
    }
  });

  // Shikoba aparece depois da última linha
  const shikobaTempo = tempoFim + 1.4;

  const sw = document.createElement('div');
  sw.className = 'shikoba-wrap';
  sw.style.animation = `surgir 1.2s ease forwards ${shikobaTempo}s`;
  sw.innerHTML = `
    <div class="shikoba-linha"></div>
    <div class="shikoba-texto">Shikoba.</div>
    <div class="shikoba-emoji">🤍</div>
  `;
  container.appendChild(sw);
}

// ─── INIT ───────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('data').textContent = formatarData();
  construir();
});
</script>

</body>
</html>
